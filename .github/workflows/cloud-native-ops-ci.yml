# Track 4 (cloud-native-ops): checks that need no cluster, plus the real Terraform against a throwaway kind cluster.
name: Cloud-native ops CI
on:
  push:
    paths: ['cloud-native-ops/**', 'cicd-observability/k8s/chart/**', '.github/workflows/cloud-native-ops-ci.yml']
  pull_request:
    paths: ['cloud-native-ops/**', 'cicd-observability/k8s/chart/**', '.github/workflows/cloud-native-ops-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-native-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Terraform, policy, tools, scripts and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: selftest (no cluster)
        run: |
          pip install pyyaml
          ./cloud-native-ops/scripts/selftest.sh

  iac-integration:
    name: Real Terraform against a kind cluster
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: iac
      - name: plan, policy, apply, drift, destroy (as the pipeline's ServiceAccount)
        run: |
          kubectl get nodes
          IAC_TEST_OK="$(kubectl config current-context)" ./cloud-native-ops/projects/infra-factory/tests/iac-test.sh
