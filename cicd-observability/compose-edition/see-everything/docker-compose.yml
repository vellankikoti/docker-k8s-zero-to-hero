# See Everything: "See Everything". One command, a full observability platform around a live app.
#   docker compose up -d --build        then follow README.md
name: seeall

x-app: &app
  build:
    context: ../../app
    args: { APP_VERSION: "1.0.0" }
  image: chai-stall:1.0.0
  labels: { logging: "true" }          # Alloy ships the logs of containers with this label
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  restart: unless-stopped

services:
  chai-1:
    <<: *app
    ports: ["8091:8080"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      SERVICE_NAME: chai-stall
  chai-2:
    <<: *app
    ports: ["8092:8080"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      SERVICE_NAME: chai-stall

  loadgen:                              # a steady trickle of customers, so graphs have something to show
    image: python:3.12-alpine
    command: ["python", "-u", "/loadgen.py"]
    volumes: ["./loadgen/loadgen.py:/loadgen.py:ro"]
    environment:
      TARGETS: http://chai-1:8080,http://chai-2:8080
      RATE_PER_SECOND: "8"
    depends_on: [chai-1, chai-2]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle           # lets us reload config with a POST (no restart)
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [alertmanager]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes: ["./alertmanager:/etc/alertmanager:ro"]
    ports: ["9093:9093"]
    depends_on: [mailpit]
    restart: unless-stopped

  mailpit:                              # a fake inbox: every alert email lands here, nothing leaves your laptop
    image: axllent/mailpit:v1.24
    ports: ["8025:8025"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.1
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]
    restart: unless-stopped

  alloy:                                # the log shipper: reads container logs, pushes them to Loki
    image: grafana/alloy:v1.9.1
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  jaeger:                               # trace storage + UI
    image: jaegertracing/jaeger:2.7.0
    ports: ["16686:16686"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: z2h-grafana        # lab password: never use a fixed one for real
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/chai-stall.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, jaeger]
    restart: unless-stopped

volumes:
  prom-data:
  loki-data:
  grafana-data:
