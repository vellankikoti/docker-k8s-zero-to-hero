apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chai.fullname" . }}
  labels:
    {{- include "chai.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chai.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "chai.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:                       # Pod Security "restricted" (Lab K16): the namespace enforces it
        runAsNonRoot: true                   # the IMAGE must declare a non-root user (the Dockerfile's USER 10001);
        seccompProfile: { type: RuntimeDefault }   # if it does not, the kubelet refuses to start it (Scenario S4.5)
      containers:
        - name: chai-stall
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required: the pipeline sets it" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CHAOS_ERROR_RATE
              value: {{ .Values.chaos.errorRate | quote }}
            - name: CHAOS_LATENCY_MS
              value: {{ .Values.chaos.latencyMs | quote }}
            - name: SERVICE_NAME
              value: chai-stall
            {{- if .Values.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otlpEndpoint | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 1
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
