# `helm test <release>` runs this Pod: it must succeed before a release counts as healthy.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "chai.fullname" . }}-smoke
  labels:
    # NOT the app's selector labels: the Service, the Deployment and the PodDisruptionBudget select by those, and a test
    # Pod must never be counted as one of the app's Pods.
    app.kubernetes.io/component: smoke-test
    app.kubernetes.io/part-of: chai-stall
    app.kubernetes.io/instance-under-test: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    # Keep the Pod after it finishes (the next test replaces it): its output stays readable with `kubectl logs`. Deleting it on
    # success ("hook-succeeded") made `helm test --logs` fail with "pod not found" even though the test PASSED.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: smoke
      image: curlimages/curl:8.11.1
      command: ["sh", "-c"]
      args:
        - |
          set -e
          B=http://{{ include "chai.fullname" . }}:{{ .Values.service.port }}
          curl -sf $B/readyz
          curl -sf $B/api/info | grep -q '"version": "{{ .Values.image.tag }}"'
          echo "smoke test passed for {{ .Values.image.tag }}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
