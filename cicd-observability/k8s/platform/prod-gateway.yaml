# Production's front door (Lab K12): ONE Gateway and ONE HTTPRoute. Blue/green and canary are just weights:
#   weight 100/0  = all traffic to blue            weight 80/20 = a canary of 20% on green
# The pipeline changes the weights with `kubectl patch`; nothing else in the cluster moves.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chai
  namespace: stall-prod
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chai
  namespace: stall-prod
spec:
  parentRefs:
    - name: chai
  rules:
    - backendRefs:
        - { name: chai-blue,  port: 80, weight: 100 }
        - { name: chai-green, port: 80, weight: 0 }
