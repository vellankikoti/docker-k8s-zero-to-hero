# Lab K14 at work: who may deploy what?
# Build agents run as ServiceAccount "jenkins-agent" in namespace "cicd". It may change things ONLY inside the
# two app namespaces, and read almost nothing elsewhere. Try:
#   kubectl auth can-i create deployments -n stall-prod    --as=system:serviceaccount:cicd:jenkins-agent    -> yes
#   kubectl auth can-i create deployments -n kube-system   --as=system:serviceaccount:cicd:jenkins-agent    -> no
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: stall-staging
rules:
  - apiGroups: [""]
    resources: [services, configmaps, pods, pods/log, serviceaccounts, secrets]   # secrets: Helm stores each release in one
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: stall-prod
rules:
  - apiGroups: [""]
    resources: [services, configmaps, pods, pods/log, serviceaccounts, secrets]   # secrets: Helm stores each release in one
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent-can-deploy
  namespace: stall-staging
subjects:
  - { kind: ServiceAccount, name: jenkins-agent, namespace: cicd }
roleRef: { kind: Role, name: deployer, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent-can-deploy
  namespace: stall-prod
subjects:
  - { kind: ServiceAccount, name: jenkins-agent, namespace: cicd }
roleRef: { kind: Role, name: deployer, apiGroup: rbac.authorization.k8s.io }
