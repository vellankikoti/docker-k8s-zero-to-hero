# The image registry: where the pipeline PUBLISHES its artifact and where the kubelet PULLS it from (Lab C04).
# One registry, two names (this trips everyone up once, so it is on purpose):
#   push (from a build Pod, inside the cluster):  registry.cicd.svc.cluster.local:5000/chai-stall:1.0.7
#   pull (by the node's kubelet, outside Pod DNS): localhost:30500/chai-stall:1.0.7      <- the NodePort below
# Same bytes, same digest: only the address differs, because the node cannot resolve cluster DNS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: cicd
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: cicd
  labels: { app: registry }
spec:
  replicas: 1
  strategy: { type: Recreate }            # a ReadWriteOnce volume: stop the old Pod before starting the new one (Lab K10)
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      enableServiceLinks: false
      containers:
        - name: registry
          image: registry:2
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          readinessProbe:
            httpGet: { path: /v2/, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-data }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: cicd
spec:
  selector: { app: registry }
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: registry-nodeport
  namespace: cicd
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
