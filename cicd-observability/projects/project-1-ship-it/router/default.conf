# What the router says before anything is deployed. deploy.sh replaces this file inside the container.
resolver 127.0.0.11 valid=2s ipv6=off;
server {
  listen 80;
  default_type text/plain;
  location /roll/ {            # rolling replicas share one DNS name: Docker DNS hands out every healthy one
    set $roll chai-roll;
    rewrite ^/roll/(.*)$ /$1 break;
    proxy_pass http://$roll:8080;
  }
  location / { return 503 "nothing deployed yet: run the pipeline\n"; }
}
