global:
  smtp_smarthost: mailpit:1025
  smtp_from: alertmanager@stall.local
  smtp_require_tls: false

route:
  receiver: oncall-email
  group_by: [alertname]
  group_wait: 10s            # lab speed. Production: 30s.
  group_interval: 30s
  repeat_interval: 1h
  routes:
    - matchers: [severity="critical"]
      receiver: oncall-email
      repeat_interval: 15m

receivers:
  - name: oncall-email
    email_configs:
      - to: oncall@stall.local
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        html: |
          <h3>{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</h3>
          {{ range .Alerts }}<p><b>{{ .Annotations.summary }}</b><br>{{ .Annotations.description }}</p>{{ end }}

# If the service is down, we don't also need a "slow" warning about the same thing.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [team]
