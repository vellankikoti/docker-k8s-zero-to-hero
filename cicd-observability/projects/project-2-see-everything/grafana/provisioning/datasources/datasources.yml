apiVersion: 1
datasources:
  - { name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true }
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:                      # click a trace_id in a log line to jump to the trace
        - { name: trace_id, matcherRegex: '"trace_id": "(\w+)"', url: "$${__value.raw}", datasourceUid: jaeger }
  - { name: Jaeger, uid: jaeger, type: jaeger, access: proxy, url: "http://jaeger:16686" }
