# Recording rules: pre-compute the SLIs once, so dashboards and alerts stay fast and consistent.
groups:
  - name: sli
    rules:
      # SLI 1 (availability): share of /order requests that FAILED (5xx), over several windows.
      # "or vector(0)" matters: with zero errors there is no 5xx series, and without it the SLI would be empty, not 0.
      - record: sli:order_errors:ratio_rate1m
        expr: |
          (sum(rate(http_requests_total{job="chai-stall",path="/order",status=~"5.."}[1m])) or vector(0))
          / sum(rate(http_requests_total{job="chai-stall",path="/order"}[1m]))
      - record: sli:order_errors:ratio_rate5m
        expr: |
          (sum(rate(http_requests_total{job="chai-stall",path="/order",status=~"5.."}[5m])) or vector(0))
          / sum(rate(http_requests_total{job="chai-stall",path="/order"}[5m]))
      - record: sli:order_errors:ratio_rate30m
        expr: |
          (sum(rate(http_requests_total{job="chai-stall",path="/order",status=~"5.."}[30m])) or vector(0))
          / sum(rate(http_requests_total{job="chai-stall",path="/order"}[30m]))
      # SLI 2 (latency): share of /order requests answered in 250 ms or less (the "good" ones).
      - record: sli:order_latency_good:ratio_rate5m
        expr: |
          sum(rate(http_request_duration_seconds_bucket{job="chai-stall",path="/order",le="0.25"}[5m]))
          / sum(rate(http_request_duration_seconds_count{job="chai-stall",path="/order"}[5m]))
      # Handy aggregates for the dashboard
      - record: job:http_requests:rate1m
        expr: sum by (status) (rate(http_requests_total{job="chai-stall"}[1m]))
      - record: job:order_latency_p95:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="chai-stall",path="/order"}[5m])))
