# The infrastructure pipeline's build Pod. It runs as the ServiceAccount "terraform-runner" (see platform/00-tfstate-and-runner.yaml):
# the ONLY identity in the cluster allowed to create namespaces. App pipelines run as "jenkins-agent", which cannot (Lab K14).
apiVersion: v1
kind: Pod
spec:
  serviceAccountName: terraform-runner
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: terraform
      image: hashicorp/terraform:1.9.8
      command: ["cat"]
      tty: true
      env:
        - { name: HOME, value: /tmp }
        - { name: TF_PLUGIN_CACHE_DIR, value: /tmp/tf-plugin-cache }
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
    - name: conftest                       # policy as code: reads the plan, says yes or no
      image: openpolicyagent/conftest:v0.62.0
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 25m, memory: 64Mi }
    - name: tools                          # kubectl + curl, to look at the result
      image: alpine/k8s:1.34.1
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: 25m, memory: 64Mi }
