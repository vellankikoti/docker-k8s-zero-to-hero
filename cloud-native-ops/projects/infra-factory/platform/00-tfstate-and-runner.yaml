# What Terraform needs from the cluster, applied once (as the cluster admin) by up.sh.
#   tfstate            where Terraform's memory lives: one Secret per environment (+ a Lease that acts as the lock)
#   terraform-runner   the ServiceAccount the PIPELINE's Terraform runs as. Powerful (it builds namespaces), so it is limited:
#                      only the kinds of objects this project creates, no nodes, no CRDs, no cluster-admin, and it can
#                      read Secrets ONLY in tfstate. A person approves every plan before it applies (Lab O03).
apiVersion: v1
kind: Namespace
metadata:
  name: tfstate
  labels:
    pod-security.kubernetes.io/enforce: restricted
    app.kubernetes.io/part-of: infra-factory
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: terraform-runner, namespace: cicd }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: terraform-runner }
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts, resourcequotas, limitranges]      # configmaps: Helm keeps its release records here
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]                  # note: no "escalate" and no "bind": it cannot give anyone more than it has
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: terraform-runner }
subjects: [{ kind: ServiceAccount, name: terraform-runner, namespace: cicd }]
roleRef: { kind: ClusterRole, name: terraform-runner, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: terraform-state, namespace: tfstate }
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: terraform-state, namespace: tfstate }
subjects: [{ kind: ServiceAccount, name: terraform-runner, namespace: cicd }]
roleRef: { kind: Role, name: terraform-state, apiGroup: rbac.authorization.k8s.io }
